<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Proxy · Rule Studio</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8edf7;background:#0d111b;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.app{min-height:100vh;display:grid;grid-template-columns:315px 1fr}.sidebar{border-right:1px solid #293142;background:#121824;min-height:100vh;padding:26px 18px}.brand{display:flex;align-items:center;gap:13px;margin-bottom:26px}.logo{height:39px;width:39px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,#6e7aff,#30bcda);font-size:21px}.brand b{font-size:18px}.brand small{color:#8e9cb1;display:block;margin-top:3px}.btn{border:1px solid #3b485e;border-radius:10px;color:#ebefff;background:#263249;padding:10px 14px;transition:.15s}.btn:hover{background:#354765}.primary{background:#5869e8;border-color:#5869e8}.primary:hover{background:#7280f7}.danger{color:#fda9b0;border-color:#5b3642;background:#321e29}.full{width:100%}.sidehead{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px;color:#9daac1;font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.rlist{display:flex;flex-direction:column;gap:8px}.ritem{border:1px solid transparent;background:#192233;color:#dfe6f5;padding:14px 12px;text-align:left;border-radius:11px;width:100%;display:flex;gap:11px;align-items:center}.ritem.selected{background:#202c4a;border-color:#566ce1}.ritem strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:207px}.ritem small{display:block;color:#93a2bc;margin-top:5px;font-size:11px}.dot{width:8px;height:8px;border-radius:50%;background:#56d9a3;flex-shrink:0}.dot.off{background:#6b758a}.sidefoot{margin-top:25px;color:#8896ad;font-size:12px;line-height:1.6}.main{padding:32px clamp(20px,5vw,64px);max-width:1280px;width:100%;margin:0 auto}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}.topline h1{font-size:26px;margin:0 0 7px}.muted{color:#94a1b7}.status{border:1px solid #305f55;background:#173b35;padding:8px 12px;border-radius:99px;color:#8ee6c2;font-weight:600;font-size:12px}.panel{border:1px solid #2b3447;border-radius:17px;background:#151c2b;padding:25px;margin-bottom:18px}.panelhead{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:20px}.panel h2{margin:0;font-size:17px}.panel p{margin:5px 0 0;color:#95a1b8;font-size:12px;line-height:1.5}.fields{display:grid;grid-template-columns:1fr 1fr;gap:17px}.field{display:flex;flex-direction:column;gap:8px;min-width:0}.field.wide{grid-column:1/-1}.field label{color:#b9c5d8;font-size:12px;font-weight:600}.field input,.field textarea,.field select{width:100%;border-radius:9px;background:#0e1522;border:1px solid #354157;color:#edf2ff;padding:11px 12px;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:#7d8eff}.field textarea{font-family:ui-monospace,Menlo,Monaco,monospace;line-height:1.5;min-height:100px;resize:vertical;font-size:12px}.field .code{min-height:175px}.hint{font-size:12px;color:#8b9ab3;line-height:1.5}.toggle{display:inline-flex;align-items:center;gap:9px;color:#d7e0ef}.toggle input{accent-color:#7182ef;width:17px;height:17px}.tabs{display:flex;gap:6px;border-bottom:1px solid #334057;margin-bottom:22px}.tab{background:transparent;border:0;color:#94a5c1;padding:12px 18px;border-bottom:2px solid transparent;font-weight:600}.tab.active{color:#bdc8ff;border-color:#7b8dff}.notice{border:1px solid #3d4766;background:#1b2641;padding:12px 14px;border-radius:10px;color:#bac8f7;font-size:12px;margin:14px 0 21px;line-height:1.5}.actions{display:flex;align-items:center;gap:9px;justify-content:space-between}.right{display:flex;gap:9px}.toast{position:fixed;bottom:20px;right:24px;border:1px solid #3b7565;background:#1b413b;padding:13px 18px;color:#c5ffe9;border-radius:12px;box-shadow:0 16px 30px #0006;display:none;z-index:20;max-width:450px}.toast.error{border-color:#a85061;background:#59252f;color:#ffe5e9}.empty{padding:50px 20px;text-align:center;color:#96a5bf}.empty strong{display:block;color:#d2dbec;font-size:18px;margin:14px}.chip{color:#b5c8ff;background:#29365b;border-radius:7px;padding:5px 8px;font-size:11px}.example{font-family:monospace;font-size:11px;color:#a1b6e7;background:#101829;padding:11px;border-radius:8px;word-break:break-all}@media(max-width:850px){.app{grid-template-columns:1fr}.sidebar{min-height:auto;border-right:0;border-bottom:1px solid #293142}.main{padding:25px 16px}.fields{grid-template-columns:1fr}.panel{padding:17px}.actions{flex-wrap:wrap}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="logo">↔</div><div><b>Smart Proxy</b><small>QA Rule Studio</small></div></div><button class="btn primary full" id="add">＋ Создать правило</button><div class="sidehead"><span>Правила</span><span id="count">0</span></div><div id="ruleList" class="rlist"></div><div class="sidefoot">Панель: <b>127.0.0.1:8765</b><br>Прокси: <b>порт 8080</b><br>Все изменения сохраняются в <code>rules.json</code>.</div></aside><main class="main"><div class="topline"><div><h1>Настройка подмены трафика</h1><div class="muted">Изменяй только те части HTTP, которые нужны для теста.</div></div><span class="status">● Local UI</span></div><div id="editor"></div></main></div><div id="toast" class="toast"></div>
<script>
'use strict';
let rules=[], selected=null, phase='response';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blankPhase=()=>({enabled:false,body_mode:'none',body:'',content_type:'',set_headers:{},remove_headers:[],status_code:null});
function newRule(){return {id:crypto.randomUUID?.()||String(Date.now()),name:'Новое правило',enabled:true,method:'*',match_mode:'contains',url_pattern:'',request:blankPhase(),response:{...blankPhase(),enabled:true}}}
function toast(message,error=false){let t=$('#toast');t.textContent=message;t.className='toast'+(error?' error':'');t.style.display='block';setTimeout(()=>{t.style.display='none'},4500)}
async function load(){try{const r=await fetch('/api/rules');if(!r.ok)throw new Error('Ошибка загрузки');rules=await r.json();selected=rules[0]?.id??null;render()}catch(e){toast(e.message,true)}}
async function save(){try{const r=await fetch('/api/rules',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rules)});const data=await r.json();if(!r.ok)throw Error(data.error||'Ошибка');toast('Правила сохранены и применяются к новым запросам');renderList()}catch(e){toast('Не сохранено: '+e.message,true)}}
function current(){return rules.find(r=>r.id===selected)}
function renderList(){let root=$('#ruleList');$('#count').textContent=rules.length;root.innerHTML='';rules.forEach(rule=>{let b=document.createElement('button');b.className='ritem'+(rule.id===selected?' selected':'');const d=document.createElement('span');d.className='dot'+(rule.enabled?'':' off');const txt=document.createElement('span');txt.style.minWidth='0';let strong=document.createElement('strong');strong.textContent=rule.name||'Без названия';let small=document.createElement('small');small.textContent=(rule.method||'*')+' · '+(rule.match_mode||'contains')+' · '+(rule.url_pattern||'URL не задан');txt.append(strong,small);b.append(d,txt);b.onclick=()=>{selected=rule.id;phase='response';render()};root.append(b)})}
function render(){renderList();let r=current(),e=$('#editor');if(!r){e.innerHTML='<div class="panel empty"><strong>Нет выбранного правила</strong>Нажми «Создать правило», чтобы начать.</div>';return}let p=r[phase]||blankPhase();e.innerHTML=`
<div class="panel"><div class="panelhead"><div><h2>Основные параметры</h2><p>Настрой, для каких HTTP-вызовов применяется правило.</p></div><label class="toggle"><input id="enabled" type="checkbox" ${r.enabled?'checked':''}> Активно</label></div>
<div class="fields"><div class="field wide"><label>Название правила</label><input id="name" value="${esc(r.name)}" placeholder="Например: Лимит по IDN"></div>
<div class="field"><label>HTTP метод</label><select id="method">${['*','GET','POST','PUT','PATCH','DELETE','OPTIONS','HEAD'].map(v=>`<option ${r.method===v?'selected':''}>${v}</option>`).join('')}</select></div>
<div class="field"><label>Как сравнивать URL</label><select id="match_mode">${[['exact','Точное совпадение'],['contains','Содержит текст'],['glob','Маска *'],['regex','Регулярное выражение']].map(([v,l])=>`<option value="${v}" ${r.match_mode===v?'selected':''}>${l}</option>`).join('')}</select></div>
<div class="field wide"><label>URL или шаблон URL</label><input id="url_pattern" value="${esc(r.url_pattern)}" placeholder="/dbp-interbank-transfers/api/v1/limits"><div class="hint" id="matchHint"></div></div></div></div>
<div class="panel"><div class="panelhead"><div><h2>Что изменить</h2><p>Запрос отправляется на сервер; ответ меняется после получения от сервера.</p></div><span class="chip">${phase==='request'?'→ Клиент → сервер':'← Сервер → клиент'}</span></div>
<div class="tabs"><button class="tab ${phase==='request'?'active':''}" id="requestTab">↑ Запрос (Request)</button><button class="tab ${phase==='response'?'active':''}" id="responseTab">↓ Ответ (Response)</button></div>
<label class="toggle"><input id="phase_enabled" type="checkbox" ${p.enabled?'checked':''}> Включить изменения ${phase==='request'?'запроса':'ответа'}</label>
<div class="notice">По умолчанию заголовки, тело и ${phase==='response'?'HTTP-статус':'остальные параметры'} сохраняются. Изменится только то, что явно задано ниже.</div>
<div class="fields"><div class="field"><label>Как изменить Body</label><select id="body_mode">${[['none','Не менять'],['replace','Полностью заменить Body'],['json_merge','Обновить только указанные поля JSON']].map(([v,l])=>`<option value="${v}" ${p.body_mode===v?'selected':''}>${l}</option>`).join('')}</select></div>
${phase==='response'?`<div class="field"><label>HTTP статус (необязательно)</label><input id="status_code" inputmode="numeric" type="number" min="100" max="599" placeholder="Не менять" value="${esc(p.status_code??'')}"></div>`:'<div></div>'}
<div class="field wide"><label>Новое тело / JSON-патч</label><textarea class="code" id="body" spellcheck="false" placeholder='{"data":{"limit":300000}}'>${esc(p.body)}</textarea><div class="hint">«Полностью заменить»: вставь весь body. «Обновить поля JSON»: вставь JSON-объект с изменяемыми ключами, остальное останется исходным.</div></div>
<div class="field wide"><label>Content-Type (необязательно)</label><input id="content_type" placeholder="Оставить без изменений" value="${esc(p.content_type)}"></div>
<div class="field"><label>Установить / заменить заголовки (JSON-объект)</label><textarea id="set_headers" spellcheck="false" placeholder='{"X-Test":"true"}'>${esc(JSON.stringify(p.set_headers||{},null,2))}</textarea></div>
<div class="field"><label>Удалить заголовки (по одному на строку)</label><textarea id="remove_headers" spellcheck="false" placeholder="X-Debug-Header">${esc((p.remove_headers||[]).join('\n'))}</textarea></div></div></div>
<div class="actions"><div class="right"><button class="btn danger" id="del">Удалить</button><button class="btn" id="duplicate">Дублировать</button></div><button class="btn primary" id="save">Сохранить и применить</button></div>`;
const bind=(id,key,transform=v=>v,at=r)=>{let node=$('#'+id);if(!node)return;node.addEventListener(node.type==='checkbox'?'change':'input',()=>{at[key]=transform(node.type==='checkbox'?node.checked:node.value);if(id==='name')renderList()})};
bind('enabled','enabled');bind('name','name');bind('method','method');bind('match_mode','match_mode');bind('url_pattern','url_pattern');
bind('phase_enabled','enabled',v=>v,p);bind('body_mode','body_mode',v=>v,p);bind('body','body',v=>v,p);bind('content_type','content_type',v=>v,p);
if(phase==='response')bind('status_code','status_code',v=>v?Number(v):null,p);
const hints={exact:'Полный URL должен совпасть, включая query-параметры.',contains:'Ищем эту строку в URL. Подойдёт, даже если idn_code или другие параметры меняются.',glob:'Используй * для произвольной части адреса. Например https://*/users/*/limits',regex:'Регулярное выражение. Например /users/[^/]+/limits'};
$('#matchHint').textContent=hints[r.match_mode]||'';$('#match_mode').onchange=ev=>{r.match_mode=ev.target.value;$('#matchHint').textContent=hints[r.match_mode]};
$('#set_headers').addEventListener('change',ev=>{try{let v=JSON.parse(ev.target.value||'{}');if(!v||Array.isArray(v)||typeof v!=='object')throw Error();p.set_headers=v;ev.target.style.borderColor=''}catch{ev.target.style.borderColor='#e66d7b';toast('Заголовки должны быть JSON-объектом',true)}});
$('#remove_headers').addEventListener('input',ev=>{p.remove_headers=ev.target.value.split('\n').map(x=>x.trim()).filter(Boolean)});
$('#requestTab').onclick=()=>switchTab('request');$('#responseTab').onclick=()=>switchTab('response');
$('#save').onclick=()=>{let el=$('#set_headers');try{let o=JSON.parse(el.value||'{}');if(!o||typeof o!=='object'||Array.isArray(o))throw Error();p.set_headers=o}catch{return toast('Исправь JSON заголовков',true)};if(p.body_mode==='json_merge'){try{const x=JSON.parse(p.body||'{}');if(!x||Array.isArray(x)||typeof x!=='object')throw Error()}catch{return toast('Для JSON Merge требуется JSON-объект',true)}}save()};
$('#del').onclick=()=>{if(!confirm('Удалить это правило?'))return;rules=rules.filter(x=>x.id!==r.id);selected=rules[0]?.id??null;render();save()};
$('#duplicate').onclick=()=>{let clone=JSON.parse(JSON.stringify(r));clone.id=crypto.randomUUID?.()||String(Date.now());clone.name+=' (копия)';rules.push(clone);selected=clone.id;render();save()};}
function switchTab(next){const input=$('#set_headers');if(input){try{const val=JSON.parse(input.value||'{}');if(!val||typeof val!=='object'||Array.isArray(val))throw Error();current()[phase].set_headers=val}catch{return toast('Исправь JSON заголовков перед сменой вкладки',true)}}phase=next;render()}
$('#add').onclick=()=>{let r=newRule();rules.push(r);selected=r.id;phase='response';render()};load();
</script></body></html>
